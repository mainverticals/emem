<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">
</head>
<body>
<script type="text/javascript" src="js/jquery.js"></script>
<script type="text/javascript">
    setTimeout(function(){
        const urlParams = new URLSearchParams(window.location.search);
        const click_id = urlParams.get('click_id');
        var url_arg = "?click_id=" + click_id;
        
        if(urlParams.has('source_id')){
            const source_id = urlParams.get('source_id');
            url_arg = url_arg + "&source_id=" + source_id;
        }
        
        // Define the array of target URLs
        const links = [
        "https://ilyvo.com/wvgp/emem-p/emem-p.html",
	    "https://ilyvo.com/qebg/emem-p/emem-p.html",
	    "https://ilyvo.com/rwew/emem-p/emem-p.html",
        "https://ilyvo.com/qeew/emem-p/emem-p.html"
        ];
        
        // Pick a random link from the array
        const randomLink = links[Math.floor(Math.random() * links.length)];
        
        // Redirect to the chosen link with the arguments attached
        window.location.href = randomLink + url_arg;
    }, 0);
</script>
</body>
</html>
